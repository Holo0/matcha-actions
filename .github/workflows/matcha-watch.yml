name: Veille matcha Marukyu-Koyamaen

# Le corps du relevé vit dans matcha-watch-shared.yml, partage par les trois
# boutiques. Ce fichier ne porte que ce qui est propre a Marukyu : ses crons,
# ses fichiers, et le fait que cette boutique exige une session authentifiee.

on:
  # GitHub evalue les crons en UTC. Minute 13 volontairement : les jobs planifies
  # a la minute 0 sont massivement retardes (parfois 20 min) par la file d'attente.
  # Le cron horaire n'est plus qu'un filet de securite : c'est le backend
  # MatchAlert qui pilote desormais le rythme, par workflow_dispatch
  # (ScrapperTriggerJob). Il est garde parce qu'il ne depend de rien d'autre que
  # de GitHub — si le backend est en veille ou en panne, le releve gratuit
  # continue de tourner et la supervision continue de voir des runs.
  schedule:
    - cron: "13 * * * *"

    # Le cron dense du palier Premium (*/15) a ete retire : GitHub declenche les
    # crons « au mieux » et, mesure sur ce depot, un cron */10 partait en
    # realite toutes les 2 a 12 heures. Un palier vendu « toutes les 15 min »
    # ne peut pas reposer dessus. Le scan dense est declenche par le backend,
    # qui tient l'heure exacte (voir SETUP-DECLENCHEUR-BACKEND.md).

  # Bouton "Run workflow" dans l'onglet Actions, pour tester quand vous voulez.
  workflow_dispatch:
    inputs:
      mode:
        description: "Palier : gratuit (tout le catalogue) ou premium (produits suivis seulement)"
        type: choice
        options:
          - gratuit
          - premium
        default: gratuit
      only:
        description: "Produits a surveiller (vide = tout le catalogue, ou MATCHA_ONLY si defini)"
        required: false
        default: ""
      verbose:
        description: "Mode bavard (diagnostic de connexion)"
        type: boolean
        default: false

# Deux executions ne doivent jamais se chevaucher : elles se marcheraient dessus
# en ecrivant l'etat et en poussant sur le depot.
concurrency:
  group: matcha-watch
  cancel-in-progress: false

jobs:
  releve:
    # Voir matcha-watch-lesthes.yml : un workflow reutilisable ne peut que
    # restreindre les permissions de son appelant. A garder aligne sur le bloc
    # permissions de matcha-watch-shared.yml.
    permissions:
      contents: write # committer l'etat du releve
      issues: write # ouvrir une issue en cas de restock
    uses: ./.github/workflows/matcha-watch-shared.yml
    # Les secrets ne traversent pas `uses` d'eux-memes : sans cette ligne, le
    # workflow partage n'aurait ni identifiants de connexion ni cle d'API.
    secrets: inherit
    with:
      # Palier du run : c'est le declencheur (backend ou run manuel) qui le
      # dit, et non plus un cron reconnu a sa minute.
      dense: ${{ github.event.inputs.mode == 'premium' }}
      shop_name: Marukyu-Koyamaen
      script: matcha_watch.py
      magasin: "1"
      state_files: "matcha_state.json stock.csv stock.json"
      csv_file: stock.csv
      json_file: stock.json
      log_file: run.log
      # beautifulsoup4 en plus : le theme rend chaque variante en dur, il faut
      # parser la fiche produit.
      pip_packages: "requests beautifulsoup4"
      # 47 fiches x delai 10-20s (scan complet) approchent les 20 min ; marge
      # portee a 30 pour ne pas couper un run en cours.
      timeout_minutes: 30
      # Seule boutique a exiger une connexion : d'ou les cookies mis en cache,
      # le reveil du backend et le delai entre deux fiches.
      needs_session: true
      delay_full: "10-20"
      delay_dense: "6-12"
      only_override: ${{ github.event.inputs.only || '' }}
      verbose: ${{ github.event.inputs.verbose == 'true' }}
      # Repli vide = tout le catalogue. Auparavant limite a 4 produits pour
      # tenir dans le quota d'un depot prive ; le depot etant desormais public
      # (minutes illimitees), le catalogue complet est le comportement par
      # defaut. Definissez la variable de depot MATCHA_ONLY pour revenir a une
      # liste restreinte si besoin.
      only_fallback: ${{ vars.MATCHA_ONLY || '' }}
