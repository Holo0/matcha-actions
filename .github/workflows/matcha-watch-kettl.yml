name: Veille matcha Kettl

# Le corps du relevé vit dans matcha-watch-shared.yml, partage par toutes les
# boutiques. Ce fichier ne porte que ce qui est propre a Kettl.
#
# Le catalogue le plus fourni du lot (une cinquantaine de references, dont la
     # moitie en rupture a tout instant), et pourtant UNE seule requete : la taille
     # est une vraie variante Shopify chez ce marchand.

on:
  # Minute propre a cette boutique, pour etaler la charge sur la file de crons
  # GitHub plutot que de la concentrer au meme instant : 13 Marukyu, 17 Tokichi,
  # 23 Les Thes sur Terre, puis 29, 33, 37, 41, 47 et 53 pour les six boutiques
  # Shopify.
  #
  # Le cron horaire n'est qu'un filet de securite : c'est le backend MatchAlert
  # qui pilote le rythme, par workflow_dispatch (ScrapperTriggerJob). Il est
  # garde parce qu'il ne depend de rien d'autre que de GitHub — si le backend est
  # en veille ou en panne, le relevé gratuit continue de tourner et la
  # supervision continue de voir des runs.
  schedule:
    - cron: "37 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Palier : gratuit (tout le catalogue) ou premium (produits suivis seulement)"
        type: choice
        options:
          - gratuit
          - premium
        default: gratuit
      only:
        description: "Produits a surveiller (vide = tout le catalogue)"
        required: false
        default: ""
      verbose:
        description: "Mode bavard (diagnostic)"
        type: boolean
        default: false

concurrency:
  group: matcha-watch-kettl
  cancel-in-progress: false

jobs:
  releve:
    # Un workflow reutilisable ne peut que RESTREINDRE les permissions de son
    # appelant : sans ce bloc, le relevé ne pourrait ni committer son etat ni
    # ouvrir l'issue de secours. A garder aligne sur le bloc permissions de
    # matcha-watch-shared.yml.
    permissions:
      contents: write # committer l'etat du releve
      issues: write # ouvrir une issue en cas de restock
    uses: ./.github/workflows/matcha-watch-shared.yml
    secrets: inherit
    with:
      # Palier du run : c'est le declencheur (backend ou run manuel) qui le dit.
      dense: ${{ github.event.inputs.mode == 'premium' }}
      shop_name: Kettl
      script: matcha_watch_kettl.py
      magasin: "6"
      state_files: "kettl_state.json stock_kettl.csv stock_kettl.json"
      csv_file: stock_kettl.csv
      json_file: stock_kettl.json
      log_file: run_kettl.log
      # Pas de beautifulsoup4 : Shopify expose un catalogue JSON public, aucune
      # page a parser.
      pip_packages: "requests"
      only_override: ${{ github.event.inputs.only || '' }}
      verbose: ${{ github.event.inputs.verbose == 'true' }}
