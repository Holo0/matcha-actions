name: Veille matcha Les Thes sur Terre

# Le corps du relevé vit dans matcha-watch-shared.yml, partage par les trois
# boutiques. Ce fichier ne porte que ce qui est propre a Les Thes sur Terre.

on:
  # 13 = Marukyu, 17 = Tokichi, 23 = ici : on etale les crons plutot que de
  # les concentrer au meme instant dans la file d'attente GitHub.
  # Palier gratuit : tous les consommables de la categorie.
  schedule:
    - cron: "23 * * * *"

    # Palier Premium : ne releve que les produits de cette boutique suivis par
    # au moins un abonne actif, et saute le run si personne n'en suit.
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      only:
        description: "Produits a surveiller (vide = tous les consommables)"
        required: false
        default: ""
      verbose:
        description: "Mode bavard (liste les produits hors perimetre)"
        type: boolean
        default: false

concurrency:
  group: matcha-watch-lesthes
  cancel-in-progress: false

jobs:
  releve:
    # Un workflow reutilisable ne peut que restreindre les permissions de son
    # appelant, jamais les elargir. Sans ce bloc le job herite du defaut du
    # depot — lecture seule — et GitHub refuse l'appel avant de le lancer :
    # « is requesting 'contents: write, issues: write', but is only allowed
    # 'contents: read, issues: none' ». A garder aligne sur le bloc
    # permissions de matcha-watch-shared.yml.
    permissions:
      contents: write # committer l'etat du releve
      issues: write # ouvrir une issue en cas de restock
    uses: ./.github/workflows/matcha-watch-shared.yml
    secrets: inherit
    with:
      shop_name: Les Thes sur Terre
      script: matcha_watch_lesthes.py
      magasin: "3"
      state_files: "lesthes_state.json stock_lesthes.csv stock_lesthes.json"
      csv_file: stock_lesthes.csv
      json_file: stock_lesthes.json
      log_file: run_lesthes.log
      # beautifulsoup4 : contrairement a Tokichi (API JSON), ce site demande de
      # parser la page categorie.
      pip_packages: "requests beautifulsoup4"
      # La categorie melange thes et accessoires ; seuls les consommables sont
      # surveilles (voir CONSUMABLE_SLUGS dans le script).
      catalog_label: consommables
      only_override: ${{ github.event.inputs.only || '' }}
      verbose: ${{ github.event.inputs.verbose == 'true' }}
