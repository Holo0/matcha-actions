name: Veille matcha Nakamura Tokichi

# Le corps du relevé vit dans matcha-watch-shared.yml, partage par les trois
# boutiques. Ce fichier ne porte que ce qui est propre a Tokichi.

on:
  # Minute differente de celle du workflow Marukyu (13) pour etaler la charge
  # sur la file de crons GitHub plutot que de la concentrer au meme instant.
  # Palier gratuit : tout le catalogue.
  schedule:
    - cron: "17 * * * *"

    # Palier Premium : ne releve que les produits Tokichi suivis par au moins
    # un abonne actif, et saute le run si personne n'en suit.
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      only:
        description: "Produits a surveiller (vide = tout le catalogue)"
        required: false
        default: ""
      verbose:
        description: "Mode bavard (diagnostic)"
        type: boolean
        default: false

concurrency:
  group: matcha-watch-tokichi
  cancel-in-progress: false

jobs:
  releve:
    # Voir matcha-watch-lesthes.yml : un workflow reutilisable ne peut que
    # restreindre les permissions de son appelant. A garder aligne sur le bloc
    # permissions de matcha-watch-shared.yml.
    permissions:
      contents: write # committer l'etat du releve
      issues: write # ouvrir une issue en cas de restock
    uses: ./.github/workflows/matcha-watch-shared.yml
    secrets: inherit
    with:
      shop_name: Nakamura Tokichi
      script: matcha_watch_tokichi.py
      magasin: "2"
      state_files: "tokichi_state.json stock_tokichi.csv stock_tokichi.json"
      csv_file: stock_tokichi.csv
      json_file: stock_tokichi.json
      log_file: run_tokichi.log
      # Pas de beautifulsoup4 : Shopify expose un catalogue JSON public, aucune
      # page a parser.
      pip_packages: "requests"
      only_override: ${{ github.event.inputs.only || '' }}
      verbose: ${{ github.event.inputs.verbose == 'true' }}
